# Prometheus collector configuration for Netdata
# Scrapes RabbitMQ metrics from its Prometheus endpoint

jobs:
  - name: rabbitmq
    url: http://rabbitmq:15692/metrics
    # Collect every 10 seconds
    update_every: 10
    # Timeout for HTTP requests
    timeout: 5
    # Expected prefix for metrics (helps with parsing)
    expected_prefix: rabbitmq_
    # Fallback type for metrics without explicit type
    fallback_type:
      counter:
        - '*_total'
      gauge:
        - '*'
