map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

log_format gateway_log '$remote_addr - $remote_user [$time_local] '
	'"$request" $status $body_bytes_sent '
	'rt=$request_time urt=$upstream_response_time '
	'uaddr=$upstream_addr ustatus=$upstream_status '
	'host=$host ref="$http_referer" ua="$http_user_agent"';

upstream frontend_upstream {
	server frontend:5173;
}

upstream auth_upstream {
	server auth:3001;
}

upstream profiles_upstream {
	server profiles:3002;
}

upstream ai_places_upstream {
	server ai-places:4000;
}

upstream review_places_upstream {
	server review-places:4001;
}

upstream fav_places_upstream {
	server fav-places:4002;
}

upstream friends_api_upstream {
	server friends:4003;
}

upstream friends_ws_upstream {
	server friends:8181;
}

upstream friends_notifications_ws_upstream {
	server friends:8182;
}

upstream planner_upstream {
	server planner:7000;
}

upstream swagger_upstream {
	server swagger:8080;
}

upstream netdata_upstream {
	server netdata:19999;
}

server {
	listen 443 ssl;
	server_name auth.localhost;

	access_log /dev/stdout gateway_log;
	error_log /dev/stderr warn;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_certificate /etc/nginx/conf/server.crt;
	ssl_certificate_key /etc/nginx/conf/server.key;

	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	location / {
		proxy_pass http://auth_upstream;
	}
}

server {
	listen 443 ssl;
	server_name netdata.localhost;

	access_log /dev/stdout gateway_log;
	error_log /dev/stderr warn;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_certificate /etc/nginx/conf/server.crt;
	ssl_certificate_key /etc/nginx/conf/server.key;

	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	location / {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_pass http://netdata_upstream;
	}
}


server {
	listen 443 ssl default_server;
	server_name _ localhost;

	access_log /dev/stdout gateway_log;
	error_log /dev/stderr warn;

	error_page 497 =301 https://$host$request_uri;

	ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/conf/server.crt;
    ssl_certificate_key /etc/nginx/conf/server.key;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	location = /health {
		add_header Content-Type text/plain;
		return 200 'ok';
	}

	location /auth/ {
		proxy_pass http://auth_upstream;
	}

	location /profiles/ {
		proxy_pass http://profiles_upstream;
	}

	location /uploads/ {
		proxy_pass http://profiles_upstream;
	}

	location /autocomplete {
		proxy_pass http://ai_places_upstream;
	}

	location /places {
		proxy_pass http://ai_places_upstream;
	}

	location /reviews {
		proxy_pass http://review_places_upstream;
	}

	location /fav-places {
		proxy_pass http://fav_places_upstream;
	}

	location /friends {
		proxy_pass http://friends_api_upstream;
	}

	location /chat/ {
		proxy_pass http://friends_api_upstream;
	}

	location /notifications/ {
		proxy_pass http://friends_api_upstream;
	}

	location /notifications/ws {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_pass http://friends_notifications_ws_upstream;
	}

	location /notifications/ws/ {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_pass http://friends_notifications_ws_upstream;
	}

	# SPA route must not use prefix /plan (would match /planner → wrong upstream).
	location = /planner {
		proxy_pass http://frontend_upstream;
	}

	# Planner API: /plan/generate, /plan/:id, /plan/:id/export/...
	location /plan/ {
		proxy_pass http://planner_upstream;
	}

	location /plans {
		proxy_pass http://planner_upstream;
	}

	location /ws/ {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_pass http://friends_ws_upstream;
	}

	location /ws {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_pass http://friends_ws_upstream;
	}

	location /socket.io/ {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_pass http://friends_ws_upstream;
	}

	location /docs/ {
		proxy_pass http://swagger_upstream/;
	}

	location = /netdata {
		return 308 https://netdata.localhost:8080/;
	}

	location /netdata/ {
		return 308 https://netdata.localhost:8080/$is_args$args;
	}

	location / {
		proxy_pass http://frontend_upstream;
	}
}
