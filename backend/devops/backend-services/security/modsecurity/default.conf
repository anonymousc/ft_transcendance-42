map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

upstream frontend_upstream {
	server frontend:5173;
}

upstream auth_upstream {
	server auth:3001;
}

upstream profiles_upstream {
	server profiles:3002;
}

upstream ai_places_upstream {
	server ai-places:4000;
}

upstream review_places_upstream {
	server review-places:4001;
}

upstream fav_places_upstream {
	server fav-places:4002;
}

upstream friends_api_upstream {
	server friends:4003;
}

upstream friends_ws_upstream {
	server friends:8181;
}

upstream planner_upstream {
	server planner:7000;
}

upstream swagger_upstream {
	server swagger:8080;
}

server {
	listen 443 ssl;
	server_name _;

	# If a client mistakenly speaks plain HTTP to this HTTPS port,
	# redirect them to the proper https:// URL instead of returning a 400.
	error_page 497 =301 https://$host$request_uri;

	ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/conf/server.crt;
    ssl_certificate_key /etc/nginx/conf/server.key;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	location = /health {
		add_header Content-Type text/plain;
		return 200 'ok';
	}

	location /auth/ {
		proxy_pass http://auth_upstream;
	}

	location /profiles/ {
		proxy_pass http://profiles_upstream;
	}

	location /uploads/ {
		proxy_pass http://profiles_upstream;
	}

	location /autocomplete {
		proxy_pass http://ai_places_upstream;
	}

	location /places {
		proxy_pass http://ai_places_upstream;
	}

	location /reviews {
		proxy_pass http://review_places_upstream;
	}

	location /fav-places {
		proxy_pass http://fav_places_upstream;
	}

	location /friends {
		proxy_pass http://friends_api_upstream;
	}

	location /plan {
		proxy_pass http://planner_upstream;
	}

	location /plans {
		proxy_pass http://planner_upstream;
	}

	location /ws/ {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_pass http://friends_ws_upstream;
	}

	location /socket.io/ {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_pass http://friends_ws_upstream;
	}

	location /docs/ {
		proxy_pass http://swagger_upstream/;
	}

	location / {
		proxy_pass http://frontend_upstream;
	}
}

# Legacy/dev convenience: allow OAuth redirect URIs on http://localhost:3001/*
# and send them to the HTTPS gateway (port 443).
server {
	listen 3001;
	server_name _;
	return 301 https://$host$request_uri;
}