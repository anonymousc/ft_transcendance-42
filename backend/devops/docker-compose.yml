
services:
  frontend:
    container_name: frontend
    build: ../../frontend/
    env_file:
      .env
    ports:
      - "5173:5173"
    networks:
      - saas
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$PORT_FRONT/"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart : on-failure
