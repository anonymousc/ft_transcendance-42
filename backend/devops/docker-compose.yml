
name: travel_planning # for project name <written by czar>

services: 
  frontend:
    container_name: frontend
    build: ../../frontend/
    env_file:
      - .env
    ports:
      - "5173:5173"
    networks:
      - saas
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$PORT_FRONT/"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart : on-failure
  # authentication:
  #     image: Oauth2.0
  #     build:  ./auth~/
  database:
    container_name: prisma
    build: backend-services/prisma/
    env_file:
      - .env
    volumes:
     - data:/data
    networks:
      - saas
  # security services:
  test :
    image : alpine:3.18
    networks:
      - saas
  vault:
    container_name: vault-hashicorp
    build: backend-services/security/hashicorp-vault/
    env_file:
      - .env
    volumes:
      - shared_resources:/shared
    networks:
      - saas
    restart : on-failure
  # webserver:
  #   container_name: webserver
  #   build: backend-services/security/modsecurity/
  #   ports:
  #    - "8080:80" #shoud be changed to 443
  #   retries: on-failure
networks:
  saas :
    driver : bridge
volumes:
  data : {}
  shared_resources:
    driver_opts:
      type : tmpfs
      device : tmpfs
