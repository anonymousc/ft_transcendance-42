
name: travel_planning # for project name <written by czar>

services: 
  frontend:
    container_name: frontend
    build: ../../frontend/
    env_file:
      - .env
    ports:
      - "${PORT_FRONT}:${PORT_FRONT}"
    networks:
      - saas
    volumes:
      - ../../frontend/:/app
      - shared_resources:/data:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$PORT_FRONT/ || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart : on-failure
  redis:
    container_name: redis
    build: ./frontend-services/redis/
    env_file:
      - .env
    networks:
      - saas
    volumes:
      - shared_resources:/vault:ro
      - redis_data:/data
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: on-failure
  maptoposter:
    container_name: maptoposter
    build: ./frontend-services/maptoposter/
    env_file:
      - .env
    ports:
      - "5025:5025"
    networks:
      - saas
    volumes:
      - shared_resources:/data:ro
    depends_on:
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5025/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: on-failure
  auth:
    build: ./backend-services/auth/
    container_name: auth
    env_file:
      - .env
    networks:
      - saas
    volumes:
      - shared_resources:/data
    depends_on:
      database:
        condition: service_started
      vault:
        condition: service_healthy
    restart: on-failure
  amq:
    build: ./backend-services/rabbitmq/
    hostname: rabbitmq
    container_name: rabbitmq
    mem_limit: 512m
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15692:15692"
    networks:
      - saas
    volumes:
      - shared_resources:/vault:ro
      - rabbitmq_data:/var/lib/rabbitmq
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: on-failure
  database:
    container_name: database
    build: backend-services/prisma/
    env_file:
      - .env
    volumes:
     - data:/data
     - shared_resources:/token
     - logs:/var/logs
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - saas
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p $PORT_POSTGRES || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
  # security services:

  #logger
  logger:
    build: backend-services/logbull
    restart: on-failure
    container_name: logbull
    env_file:
      - .env
    volumes:
      - logs:/app/logs
      - shared_resources:/tmp/token:ro
      - ./.env:/.env:ro
    depends_on:
      vault:
        condition: service_healthy
      database:
        condition: service_started
    networks:
      - saas
  ######################
  ######################
  swagger:
    image: swaggerapi/swagger-ui:v5.31.0
    container_name: swagger
    environment:
      - SWAGGER_JSON=/app/swagger.json
    ports:
      - 8080:8080
      - 8080:8080
    volumes:
      - ./data/:/app/
    networks:
      - saas
  #############################
  vault:
    container_name: vault-hashicorp
    build: backend-services/security/hashicorp-vault/
    secrets:
      - google_client_id
      - google_client_secret
      - callback_url
      - frontend_url
    env_file:
      - .env
    volumes:
      - shared_resources:/shared
      - ./backend-services/security/hashicorp-vault/tools:/tools:rx
      - ./secrets~:/secrets:ro
      - ./secrets~:/secrets:ro
    networks:
      - saas
    healthcheck:
      test: ["CMD","curl", "http://0.0.0.0:$PORT_VAULT/", "--silent", "--output", "/dev/null"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart : unless-stopped
  # webserver:
  #   container_name: webserver
  #   build: backend-services/security/modsecurity/
  #   ports:
  #    - "8080:80" #shoud be changed to 443
  #   retries: on-failure
  backend:
    build: ./..
    container_name: backend
    ports:
      - "3000:3000"
      - "5555:5555"
    env_file:
      - .env
    networks:
      - saas
    volumes:
      - shared_resources:/data
    depends_on:
      database:
        condition: service_started
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/"]
      interval: 1m30s
      timeout: 60s
      retries: 3
    restart: on-failure

  # Monitoring service - Netdata
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    hostname: netdata-monitor
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - ./backend-services/netdata/go.d/prometheus.conf:/etc/netdata/go.d/prometheus.conf:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN:-}
      - NETDATA_CLAIM_URL=${NETDATA_CLAIM_URL:-https://app.netdata.cloud}
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - saas
    depends_on:
      amq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19999/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  saas :
    driver : bridge
volumes:
  data: {}
  logs: {}
  rabbitmq_data: {}
  netdata_config: {}
  netdata_lib: {}
  netdata_cache: {}
  redis_data: {}
  shared_resources:
    driver_opts:
      type : tmpfs
      device : tmpfs
secrets:
  google_client_id:
    file: ./secrets.example/google_client_id
  google_client_secret:
    file: ./secrets.example/google_client_secret
  callback_url:
    file: ./secrets.example/callback_url
  frontend_url:
    file: ./secrets.example/frontend_url