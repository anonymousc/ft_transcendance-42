  planner:
    build: ./backend/src/planner-service
    container_name: planner
    environment:
      - FAV_PLACES_URL=http://fav-places:4002
      - REVIEW_PLACES_URL=http://review-places:4001
      - PROFILES_URL=http://profiles:3002
      - AUTH_SERVICE_URL=http://auth:3001
    env_file:
      - .env
    networks:
      - saas
    volumes:
      - shared_resources:/data:ro
    depends_on:
      database:
        condition: service_healthy
      vault:
        condition: service_healthy
      profiles:
        condition: service_healthy
      fav-places:
        condition: service_healthy
      review-places:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=planner"

  webserver:
    container_name: webserver
    build: backend/devops/backend-services/security/modsecurity/
    ports:
      - "443:443"
    networks:
      - saas
    depends_on:
      logger:
        condition: service_healthy
      auth:
        condition: service_healthy
      profiles:
        condition: service_healthy
      ai-places:
        condition: service_healthy
      review-places:
        condition: service_healthy
      fav-places:
        condition: service_healthy
      netdata:
        condition: service_healthy
      planner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=nginx-gateway"

  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    hostname: netdata-monitor
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - ./backend/devops/backend-services/netdata/go.d/prometheus.conf:/etc/netdata/go.d/prometheus.conf:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN:-}
      - NETDATA_CLAIM_URL=${NETDATA_CLAIM_URL:-https://app.netdata.cloud}
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - saas
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19999/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=netdata"

networks:
  saas :
    driver : bridge
volumes:
  data: {}
  logs: {}
  netdata_config: {}
  netdata_lib: {}
  netdata_cache: {}
  redis_data: {}
  shared_resources: {}
secrets:
  google_client_id:
    file: ./backend/devops/secrets/google_client_id
  google_client_secret:
    file: ./backend/devops/secrets/google_client_secret
  callback_url:
    file: ./backend/devops/secrets/callback_url
  fortytwo_client_id:
    file: ./backend/devops/secrets/fortytwo_client_id
  fortytwo_client_secret:
    file: ./backend/devops/secrets/fortytwo_client_secret
  fortytwo_callback:
    file: ./backend/devops/secrets/fortytwo_callback
  frontend_url:
    file: ./backend/devops/secrets/frontend_url
  gemini_api_key:
    file: ./backend/devops/secrets/gemini_api_key
  google_places_api_key:
    file: ./backend/devops/secrets/google_places



