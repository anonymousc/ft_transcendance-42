
name: travel_planning # for project name <written by czar>

services: 
  frontend:
    container_name: frontend
    build: ./frontend/
    env_file:
      - .env
    ports:
      - "${PORT_FRONT}:${PORT_FRONT}"
    networks:
      - saas
    volumes:
      - ./frontend/:/app
      - shared_resources:/data:ro
    depends_on:
      auth:
        condition: service_healthy
      profiles:
        condition: service_healthy
      friends:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://frontend:$PORT_FRONT/ || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart : on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=frontend"
  redis:
    container_name: redis
    build: ./backend/devops/frontend-services/redis/
    env_file:
      - .env
    networks:
      - saas
    volumes:
      - shared_resources:/vault:ro
      - redis_data:/data
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=redis"
