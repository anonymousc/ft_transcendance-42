  auth:
    build: ./backend/src/auth-service
    container_name: auth
    ports:
      - "3001:3001"
    env_file:
      .env
    networks:
      - saas
    volumes:
      - shared_resources:/data:ro
    depends_on:
      vault:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=auth"

  profiles:
    build: ./backend/src/profiles-service
    container_name: profiles
    ports:
      - "3002:3002"
    env_file:
      - .env
    networks:
      - saas
    volumes:
      - shared_resources:/data:ro
    depends_on:
      database:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health || exit 1"]
      interval: 120s
      timeout: 60s
      retries: 3
      start_period: 2m
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=profiles"
  database:
    container_name: database
    build: ./backend/devops/backend-services/prisma/
    env_file:
      - .env
    volumes:
     - data:/data
     - shared_resources:/token
     - logs:/var/logs
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - saas
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p $PORT_POSTGRES || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=database"
  # security services:

  #logger
  logger:
    build: ./backend/devops/backend-services/logbull
    restart: on-failure
    container_name: logbull
    ports:
      - "9101:9101"
    env_file:
      - .env
    volumes:
      - logs:/app/logs
      - shared_resources:/tmp/token:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      vault:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - saas
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=logbull"
  ######################
  ######################
  swagger:
    image: swaggerapi/swagger-ui:v5.31.0
    container_name: swagger
    environment:
      - SWAGGER_JSON=/app/swagger.json
    ports:
      - "8080:8080"
    volumes:
      - ./backend/devops/data/:/app/
    networks:
      - saas
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=swagger"
  #############################
  vault:
    container_name: vault-hashicorp
    build: ./backend/devops/backend-services/security/hashicorp-vault/
    secrets:
      - google_client_id
      - google_client_secret
      - callback_url
      - frontend_url
      - gemini_api_key
      - google_places_api_key
      - fortytwo_callback
      - fortytwo_client_id
      - fortytwo_client_secret
    env_file:
      - .env
    volumes:
      - shared_resources:/shared
      - ./backend/devops/backend-services/security/hashicorp-vault/tools:/tools:rx
    networks:
      - saas
    healthcheck:
      test: ["CMD","curl", "http://0.0.0.0:$PORT_VAULT/", "--silent", "--output", "/dev/null"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart : unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=vault"
  ai-places:
    build: ./backend/src/ai-places-service
    container_name: ai-places
    ports:
      - "4000:4000"
    env_file:
      - .env
    networks:
      - saas
    restart: on-failure
    depends_on:
      vault:
        condition : service_healthy
      database: 
        condition : service_healthy
      redis:
        condition: service_healthy
    volumes:
      - shared_resources:/data/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=ai-places"

  review-places:
    build: ./backend/src/review-places
    container_name: review-places
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - PORT_VAULT=${PORT_VAULT}
    networks:
      - saas
    volumes:
      - shared_resources:/data:ro
    depends_on:
      database:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=review-places"

  fav-places:
    build: ./backend/src/fav-places
    container_name: fav-places
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - PORT_VAULT=${PORT_VAULT}
    networks:
      - saas
    volumes:
      - shared_resources:/data:ro
    depends_on:
      database:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=fav-places"

  friends:
    build: ./backend/src/friends-service
    container_name: friends
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - PORT_VAULT=${PORT_VAULT}
    networks:
      - saas
    volumes:
      - shared_resources:/data:ro
    depends_on:
      database:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=friends"

  planner:
    build: ./backend/src/planner-service
    container_name: planner
    ports:
      - "7000:7000"
    environment:
      - FAV_PLACES_URL=http://fav-places:4002
      - REVIEW_PLACES_URL=http://review-places:4001
      - PROFILES_URL=http://profiles:3002
    env_file:
      - .env
    networks:
      - saas
    volumes:
      - shared_resources:/data:ro
    depends_on:
      database:
        condition: service_healthy
      vault:
        condition: service_healthy
      profiles:
        condition: service_healthy
      fav-places:
        condition: service_healthy
      review-places:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=planner"

