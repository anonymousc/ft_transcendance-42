
name: travel_planning # for project name <written by czar>

services: 
  frontend:
    container_name: frontend
    build: ./frontend/
    env_file:
      - .env
    networks:
      - saas
    volumes:
      - ./frontend/:/app
      - shared_resources:/data:ro
    depends_on:
      auth:
        condition: service_healthy
      profiles:
        condition: service_healthy
      friends:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://frontend:$PORT_FRONT/ || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart : on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=frontend"
  redis:
    container_name: redis
    build: ./backend/devops/frontend-services/redis/
    env_file:
      - .env
    networks:
      - saas
    volumes:
      - shared_resources:/vault:ro
      - redis_data:/data
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=redis"
  auth:
    build: ./backend/src/auth-service
    container_name: auth
    env_file:
      .env
    networks:
      - saas
    volumes:
      - shared_resources:/data:ro
    depends_on:
      vault:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://auth:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=auth"

  profiles:
    build: ./backend/src/profiles-service
    container_name: profiles
    env_file:
      - .env
    networks:
      - saas
    volumes:
      - shared_resources:/data:ro
    depends_on:
      database:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health || exit 1"]
      interval: 120s
      timeout: 60s
      retries: 3
      start_period: 2m
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=profiles"
  database:
    container_name: database
    build: ./backend/devops/backend-services/prisma/
    env_file:
      - .env
    volumes:
     - data:/data
     - shared_resources:/token
     - logs:/var/logs
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - saas
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p $PORT_POSTGRES || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=database"
  # security services:

  #logger
  logger:
    image: logbull/logbull:latest
    restart: on-failure
    container_name: logbull
    env_file:
      - .env
    volumes:
      - logs:/app/logs
      - shared_resources:/tmp/token:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      vault:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - saas
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9100/api/v1/system/health || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=logbull"

  logbull-forwarder:
    container_name: logbull-forwarder
    build: ./backend/devops/backend-services/logbull-forwarder/
    env_file:
      - .env
    environment:
      - LOGBULL_BASE_URL=${LOGBULL_BASE_URL:-http://logbull:4005}
      - LOGBULL_PROJECT_ID=${LOGBULL_PROJECT_ID:-}
      - LOGBULL_API_KEY=${LOGBULL_API_KEY:-}
      - LOGBULL_ORIGIN=${LOGBULL_ORIGIN:-}
      - LOGBULL_EXCLUDED_CONTAINERS=${LOGBULL_EXCLUDED_CONTAINERS:-logbull,logbull-forwarder}
      - DOCKER_LOGS_DIR=${DOCKER_LOGS_DIR:-/var/lib/docker/containers}
      - LOG_LEVEL=${LOGBULL_FORWARDER_LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_CONTAINERS_PATH:-/goinfre/aessadik/docker/containers}:/var/lib/docker/containers:ro
    depends_on:
      logger:
        condition: service_started
    networks:
      - saas
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=logbull-forwarder"
  ######################
  ######################
  swagger:
    image: swaggerapi/swagger-ui:v5.31.0
    container_name: swagger
    environment:
      - SWAGGER_JSON=/app/swagger.json
    volumes:
      - ./backend/devops/data/:/app/
    networks:
      - saas
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=swagger"
  #############################
  vault:
    container_name: vault-hashicorp
    build: ./backend/devops/backend-services/security/hashicorp-vault/
    secrets:
      - google_client_id
      - google_client_secret
      - callback_url
      - frontend_url
      - gemini_api_key
      - google_places_api_key
      - fortytwo_callback
      - fortytwo_client_id
      - fortytwo_client_secret
    env_file:
      - .env
    volumes:
      - shared_resources:/shared
      - ./backend/devops/backend-services/security/hashicorp-vault/tools:/tools:rx
    networks:
      - saas
    healthcheck:
      test: ["CMD","curl", "http://0.0.0.0:$PORT_VAULT/", "--silent", "--output", "/dev/null"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart : unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=vault"
  ai-places:
    build: ./backend/src/ai-places-service
    container_name: ai-places
    env_file:
      - .env
    networks:
      - saas
    restart: on-failure
    depends_on:
      vault:
        condition : service_healthy
      database: 
        condition : service_healthy
      redis:
        condition: service_healthy
    volumes:
      - shared_resources:/data/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=ai-places"

  review-places:
    build: ./backend/src/review-places
    container_name: review-places
    environment:
      - PORT=4001
      - PORT_VAULT=${PORT_VAULT}
    networks:
      - saas
    volumes:
      - shared_resources:/data:ro
    depends_on:
      database:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=review-places"

  fav-places:
    build: ./backend/src/fav-places
    container_name: fav-places
    environment:
      - PORT=4002
      - PORT_VAULT=${PORT_VAULT}
    networks:
      - saas
    volumes:
      - shared_resources:/data:ro
    depends_on:
      database:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=fav-places"

  friends:
    build: ./backend/src/friends-service
    container_name: friends
