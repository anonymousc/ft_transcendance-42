networks:
  saas :
    driver : bridge
volumes:
  data: {}
  logs: {}
  netdata_config: {}
  netdata_lib: {}
  netdata_cache: {}
  redis_data: {}
  shared_resources: {}
secrets:
  google_client_id:
    file: ./backend/devops/secrets/google_client_id
  google_client_secret:
    file: ./backend/devops/secrets/google_client_secret
  callback_url:
    file: ./backend/devops/secrets/callback_url
  fortytwo_client_id:
    file: ./backend/devops/secrets/fortytwo_client_id
  fortytwo_client_secret:
    file: ./backend/devops/secrets/fortytwo_client_secret
  fortytwo_callback:
    file: ./backend/devops/secrets/fortytwo_callback
  frontend_url:
    file: ./backend/devops/secrets/frontend_url
  gemini_api_key:
    file: ./backend/devops/secrets/gemini_api_key
  google_places_api_key:
    file: ./backend/devops/secrets/google_places



