  #   container_name: maptoposter
  #   build: ./backend/devops/frontend-services/maptoposter/
  #   env_file:
  #     - .env
  #   ports:
  #     - "5025:5025"
  #   networks:
  #     - saas
  #   volumes:
  #     - shared_resources:/data:ro
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     vault:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:5025/ || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   restart: on-failure
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
