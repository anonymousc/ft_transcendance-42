
name: travel_planning # for project name <written by czar>

services: 
  frontend:
    container_name: frontend
    build: ./frontend/
    env_file:
      - .env
    environment:
      - AUTH_SERVICE_URL=http://auth:3001
    ports:
      - "${PORT_FRONT}:${PORT_FRONT}"
    networks:
      - saas
    volumes:
      - ./frontend/:/app
      - shared_resources:/data:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      # auth:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$PORT_FRONT/ || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart : on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=frontend"
  redis:
    container_name: redis
    build: ./backend/devops/frontend-services/redis/
    env_file:
      - .env
    networks:
      - saas
    volumes:
      - shared_resources:/vault:ro
      - redis_data:/data
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=redis"
  maptoposter:
    container_name: maptoposter
    build: ./backend/devops/frontend-services/maptoposter/
    env_file:
      - .env
    ports:
      - "5025:5025"
    networks:
      - saas
    volumes:
      - shared_resources:/data:ro
    depends_on:
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5025/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=maptoposter"
  # auth:
  #   build:
  #     context: ./
  #     dockerfile: backend/devops/backend-services/auth/Dockerfile
  #   container_name: auth
  #   ports:
  #     - "3001:3001"
  #   env_file:
  #     - .env
  #   environment:
  #     - AUTH_PORT=3001
  #     - NODE_ENV=production
  #   networks:
  #     - saas
  #   volumes:
  #     - shared_resources:/data
  #   depends_on:
  #     database:
  #       condition: service_started
  #     vault:
  #       condition: service_healthy
      # amq:
      #   condition: service_healthy
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    # restart: on-failure
    # logging:
    #   driver: json-file
    #   options:
    #     max-size: "10m"
    #     max-file: "3"
    #     labels: "service"
    # labels:
    #   - "service=auth"
  amq:
    build: ./backend/devops/backend-services/rabbitmq/
    hostname: rabbitmq
    container_name: rabbitmq
    mem_limit: 512m
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15692:15692"
    networks:
      - saas
    volumes:
      - shared_resources:/vault:ro
      - rabbitmq_data:/var/lib/rabbitmq
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=rabbitmq"
  database:
    container_name: database
    build: ./backend/devops/backend-services/prisma/
    env_file:
      - .env
    volumes:
     - data:/data
     - shared_resources:/token
     - logs:/var/logs
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - saas
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p $PORT_POSTGRES || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=database"
  # security services:

  #logger
  logger:
    build: ./backend/devops/backend-services/logbull
    restart: on-failure
    container_name: logbull
    ports:
      - "9100:9100"
    env_file:
      - .env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_VHOST=travel_planning
      - RABBITMQ_EXCHANGE=logs
      - RABBITMQ_QUEUE=logs.all
      - LOG_LEVEL=info
    volumes:
      - logs:/app/logs
      - shared_resources:/tmp/token:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      vault:
        condition: service_healthy
      database:
        condition: service_started
      amq:
        condition: service_healthy
    networks:
      - saas
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=logbull"
  ######################
  ######################
  swagger:
    image: swaggerapi/swagger-ui:v5.31.0
    container_name: swagger
    environment:
      - SWAGGER_JSON=/app/swagger.json
    ports:
      - "8080:8080"
    volumes:
      - ./backend/devops/data/:/app/
    networks:
      - saas
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=swagger"
  #############################
  vault:
    container_name: vault-hashicorp
    build: ./backend/devops/backend-services/security/hashicorp-vault/
    secrets:
      - google_client_id
      - google_client_secret
      - callback_url
      - frontend_url
    env_file:
      - .env
    volumes:
      - shared_resources:/shared
      - ./backend/devops/backend-services/security/hashicorp-vault/tools:/tools:rx
      - ./backend/devops/secrets~:/secrets:ro
    networks:
      - saas
    healthcheck:
      test: ["CMD","curl", "http://0.0.0.0:$PORT_VAULT/", "--silent", "--output", "/dev/null"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart : unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=vault"
  # webserver:
  #   container_name: webserver
  #   build: backend-services/security/modsecurity/
  #   ports:
  #    - "8080:80" #shoud be changed to 443
  #   retries: on-failure
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
      - "5555:5555"
    env_file:
      - .env
    environment:
      - AUTH_SERVICE_URL=http://auth:3001
    networks:
      - saas
    volumes:
      - shared_resources:/data
    depends_on:
      database:
        condition: service_started
      vault:
        condition: service_healthy
      # auth:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 1m30s
      timeout: 60s
      retries: 3
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=backend"

  # Monitoring service - Netdata
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    hostname: netdata-monitor
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - ./backend/devops/backend-services/netdata/go.d/prometheus.conf:/etc/netdata/go.d/prometheus.conf:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN:-}
      - NETDATA_CLAIM_URL=${NETDATA_CLAIM_URL:-https://app.netdata.cloud}
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - saas
    depends_on:
      amq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19999/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=netdata"

networks:
  saas :
    driver : bridge
volumes:
  data: {}
  logs: {}
  rabbitmq_data: {}
  netdata_config: {}
  netdata_lib: {}
  netdata_cache: {}
  redis_data: {}
  shared_resources:
    driver_opts:
      type : tmpfs
      device : tmpfs
secrets:
  google_client_id:
    file: ./backend/devops/secrets~/google_client_id
  google_client_secret:
    file: ./backend/devops/secrets~/google_client_secret
  callback_url:
    file: ./backend/devops/secrets~/callback_url
  frontend_url:
    file: ./backend/devops/secrets~/frontend_url
